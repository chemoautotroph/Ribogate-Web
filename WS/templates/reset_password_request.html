{% extends "base.html" %}

{% block content %}
<body class="bg-light">
    <div class="container body-content" role="main">
        <h3 class="title">Request Password Reset</h3>

        <div class="card box-shadow my-3">
            <div class="card-body">
                <p>Please enter your email address to receive a password reset link.</p>

                <form action="{{ url_for('auth.reset_password_request') }}" method="post">
                    <div class="form-group">
                        <div class="control">
                            <input class="form-control" type="email" name="email" placeholder="Your Email" autofocus="">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Reset Link</button>
                </form>
            </div>
        </div>
    </div>
</body>
{% endblock %}
