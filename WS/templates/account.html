{% extends "base.html" %}
{% block content %}
<div class="container body-content" role="main">
    <h3>TriCleaver account</h3>
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ 'alert-success' if category == 'signup_success' else 'alert-danger' }}" role="alert">{{ message }}</div>
    {% endfor %}
    <div class="card my-3"><div class="card-body">
        <p><strong>Email:</strong> {{ current_user.email }}</p>
        <p>Sign-in method: Google.</p>
    </div></div>
</div>
{% endblock %}
